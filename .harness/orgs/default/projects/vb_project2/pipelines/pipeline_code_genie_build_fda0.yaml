pipeline:
  name: pipeline_code_genie_build_fda0
  stages:
    - id: build_and_test
      name: Build and Test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - id: install_dependencies
          name: Install Dependencies
          run:
            container:
              image: node:20
            shell: bash
            script: |-
              node --version
              npm --version
              npm ci
        - id: build
          name: Build
          run:
            container:
              image: node:20
            shell: bash
            script: npm run build
        - id: lint
          name: Lint
          run:
            container:
              image: node:20
            shell: bash
            script: |-
              mkdir -p .harness/reports
              npx eslint . --format junit --output-file .harness/reports/eslint.xml
            report:
              type: junit
              paths:
                - .harness/reports/eslint.xml
  identifier: pipeline_code_genie_build_fda0
  tags:
    onboarding: "true"
